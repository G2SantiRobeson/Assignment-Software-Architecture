apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-redis
  namespace: book-reviews
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/component: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4.7-alpine
          args: [--appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
          volumeMounts:
            - { name: redis-data, mountPath: /data }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
      volumes:
        - name: redis-data
          persistentVolumeClaim: { claimName: book-reviews-redis-data }
