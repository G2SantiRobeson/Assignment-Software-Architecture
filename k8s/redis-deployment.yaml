apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-redis
  namespace: book-reviews
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/component: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4.7-alpine
          args: [--save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
