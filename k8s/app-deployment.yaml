apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-web
  namespace: book-reviews
  labels:
    app.kubernetes.io/name: book-reviews
    app.kubernetes.io/component: web
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: book-reviews
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-reviews
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: book-reviews-config
            - secretRef:
                name: book-reviews-secrets
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: rails
          image: book-reviews:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: book-reviews-config
            - secretRef:
                name: book-reviews-secrets
          startupProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
