apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-web
  namespace: book-reviews
  labels:
    app.kubernetes.io/name: book-reviews
    app.kubernetes.io/component: web
spec:
  replicas: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: book-reviews
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-reviews
        app.kubernetes.io/component: web
    spec:
      # Local single-node shared disk; use RWX/object storage for multi-node clusters.
      nodeSelector: { book-reviews-storage: "true" }
      securityContext: { fsGroup: 1000 }
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: book-reviews-config
            - secretRef:
                name: book-reviews-secrets
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: rails
          image: book-reviews:assignment4
          args: ["./bin/rails", "server"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: book-reviews-config
            - secretRef:
                name: book-reviews-secrets
          startupProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /up
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - { name: uploads, mountPath: /rails/storage }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: book-reviews-uploads }
