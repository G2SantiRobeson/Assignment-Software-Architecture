apiVersion: v1
kind: ConfigMap
metadata:
  name: book-reviews-config
  namespace: book-reviews
  labels:
    app.kubernetes.io/name: book-reviews
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  RAILS_MAX_THREADS: "5"
  DB_HOST: book-reviews-postgres
  DB_PORT: "5432"
  CACHE_ENABLED: "true"
  SEARCH_ENABLED: "true"
  REDIS_URL: redis://book-reviews-redis:6379/0
  OPENSEARCH_URL: http://book-reviews-opensearch:9200
  OPENSEARCH_INDEX: book_reviews_production_v1
