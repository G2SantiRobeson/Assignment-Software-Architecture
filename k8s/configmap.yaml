apiVersion: v1
kind: ConfigMap
metadata:
  name: book-reviews-config
  namespace: book-reviews
  labels:
    app.kubernetes.io/name: book-reviews
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_FORCE_SSL: "true"
  RAILS_ASSUME_SSL: "true"
  RAILS_SERVE_STATIC_FILES: "false"
  SKIP_DB_PREPARE: "true"
  SESSION_STORE: redis
  SESSION_SECURE: "true"
  SESSION_REDIS_URL: redis://book-reviews-redis:6379/1
  UPLOADS_PATH: /rails/storage
  APP_HOST: app.localhost
  PORT: "3000"
  OPEN_LIBRARY_ENABLED: "false"
  RAILS_MAX_THREADS: "5"
  DB_HOST: book-reviews-postgres
  DB_PORT: "5432"
  CACHE_ENABLED: "true"
  SEARCH_ENABLED: "true"
  REDIS_URL: redis://book-reviews-redis:6379/0
  OPENSEARCH_URL: http://book-reviews-opensearch:9200
  OPENSEARCH_INDEX: book_reviews_production_v1
