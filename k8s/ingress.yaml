apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: book-reviews
  namespace: book-reviews
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: book-reviews-traefik
  tls:
    - hosts: [app.localhost]
      secretName: book-reviews-tls
  rules:
    - host: app.localhost
      http:
        paths:
          - path: /assets/
            pathType: Prefix
            backend:
              service: { name: book-reviews-static, port: { number: 80 } }
          - path: /uploads/
            pathType: Prefix
            backend:
              service: { name: book-reviews-static, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: book-reviews-web, port: { number: 80 } }
