apiVersion: v1
kind: Secret
metadata:
  name: book-reviews-secrets
  namespace: book-reviews
  labels:
    app.kubernetes.io/name: book-reviews
type: Opaque
# Template only. Copy this file to secret.yaml and replace every placeholder
# before rendering or applying k8s/. secret.yaml is ignored by Git and Docker.
# stringData is intentionally used because base64 is encoding, not encryption.
stringData:
  DB_USERNAME: REPLACE_WITH_LOCAL_POSTGRES_USER
  DB_PASSWORD: REPLACE_WITH_LOCAL_POSTGRES_PASSWORD
  SECRET_KEY_BASE: REPLACE_WITH_OUTPUT_OF_RAILS_SECRET
