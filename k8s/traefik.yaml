apiVersion: v1
kind: ServiceAccount
metadata:
  name: book-reviews-traefik
  namespace: book-reviews
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: book-reviews-traefik
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: book-reviews-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: book-reviews-traefik
subjects:
  - kind: ServiceAccount
    name: book-reviews-traefik
    namespace: book-reviews
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: book-reviews-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-reviews-traefik
  namespace: book-reviews
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: traefik }
  template:
    metadata:
      labels: { app.kubernetes.io/component: traefik }
    spec:
      serviceAccountName: book-reviews-traefik
      containers:
        - name: traefik
          image: traefik:v3.6.13
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.web.http.redirections.entrypoint.to=:8443
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:8443
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=book-reviews
            - --providers.kubernetesingress.ingressclass=book-reviews-traefik
            - --ping=true
            - --accesslog=true
            - --accesslog.format=json
            - --accesslog.fields.headers.names.X-App-Instance=keep
            - --metrics.prometheus=true
          ports:
            - { name: web, containerPort: 8000 }
            - { name: websecure, containerPort: 8443 }
            - { name: health, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ping, port: health }
          livenessProbe:
            httpGet: { path: /ping, port: health }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: book-reviews-traefik
  namespace: book-reviews
spec:
  type: NodePort
  selector: { app.kubernetes.io/component: traefik }
  ports:
    - { name: web, port: 80, targetPort: web, nodePort: 30080 }
    - { name: websecure, port: 443, targetPort: websecure, nodePort: 30443 }
