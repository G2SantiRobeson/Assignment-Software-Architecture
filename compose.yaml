x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-book_reviews_development}
  DB_USERNAME: ${POSTGRES_USER:-book_reviews}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment: *app-environment
  volumes:
    - .:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_reviews_development}
      POSTGRES_USER: ${POSTGRES_USER:-book_reviews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *app-service
    command: ["bin/rails", "db:prepare"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
