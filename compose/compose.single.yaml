# Standalone entry files: docker compose -f compose/compose.single.yaml up --build -d
x-app: &app
  image: book-reviews:assignment4
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: ../.env
  environment: &environment
    RAILS_ENV: production
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run script/edge.ps1 init first}
    DB_HOST: db
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    OPEN_LIBRARY_ENABLED: "false"
    CACHE_ENABLED: "false"
    SEARCH_ENABLED: "false"
    SESSION_STORE: database
    SESSION_SECURE: "false"
    RAILS_FORCE_SSL: "false"
    RAILS_ASSUME_SSL: "false"
    RAILS_SERVE_STATIC_FILES: "true"
    UPLOADS_PATH: ${UPLOADS_PATH:-/rails/storage}
    SKIP_DB_PREPARE: "true"
    PORT: "3000"
  volumes:
    - uploads:${UPLOADS_PATH:-/rails/storage}

services:
  db:
    extends: { file: ../compose.yaml, service: db }
  prepare:
    <<: *app
    user: "0:0"
    command: [bash, -ec, 'mkdir -p "$$UPLOADS_PATH"; chown 1000:1000 "$$UPLOADS_PATH"; ./bin/rails db:prepare']
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  web:
    <<: *app
    command: ["./bin/rails", "server"]
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      prepare: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000/ready]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
